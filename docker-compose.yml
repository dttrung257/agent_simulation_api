# DEV ENVIRONMENT
services:
  api:
    container_name: ags_dev_api
    restart: always
    build:
      context: .
      dockerfile: ./docker/development/api/Dockerfile
    volumes:
      - ./src:/app/src
      - ./storage:/app/storage
      - .env:/app/.env
      - ./projects:/app/projects
      - ./gama/gama-platform:/opt/gama-platform
    ports:
      - "8080:8080"
    networks:
      - ags_network
    depends_on:
      - db
      - redis

  db:
    env_file:
      - .env
    container_name: ags_dev_db
    restart: always
    image: mysql:8.4
    ports:
      - "3306:3306"
    networks:
      - ags_network
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MYSQL_DATABASE: ags
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ags_db_volume:/var/lib/mysql

  redis:
    container_name: ags_dev_redis
    restart: always
    image: redis:7.4
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ags_redis_volume:/data/
      - ./docker/development/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - ags_network

networks:
  ags_network:
    driver: bridge

volumes:
  ags_db_volume:
  ags_redis_volume:
